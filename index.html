<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大學生 Reg 科排課時間表</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        .timetable-grid {
            display: grid;
            /* 時間欄 + 7個星期欄 */
            grid-template-columns: 80px repeat(7, minmax(100px, 1fr));
        }
    </style>
</head>
<body class="bg-slate-50 font-sans p-4 md:p-6">

    <div class="max-w-7xl mx-auto">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-slate-800 mb-2">🎓 大學生 Reg 科排課時間表</h1>
            <p class="text-slate-600">網格支援【直接點擊】排課！包含週末與半小時制，輕鬆排出完美 Time-table！</p>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-4 gap-6">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 h-fit xl:col-span-1">
                <h2 class="text-xl font-bold text-slate-700 mb-3">➕ 新增 / 編輯課程</h2>
                <p class="text-xs text-slate-400 mb-4">💡 提示：也可以直接點擊右邊課表空白格快速填寫時間。</p>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">課程名稱 / Code</label>
                        <input type="text" id="courseName" placeholder="例如: MKT2012 / CA" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">星期幾</label>
                        <select id="courseDay" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="1">星期一 (Mon)</option>
                            <option value="2">星期二 (Tue)</option>
                            <option value="3">星期三 (Wed)</option>
                            <option value="4">星期四 (Thu)</option>
                            <option value="5">星期五 (Fri)</option>
                            <option value="6">星期六 (Sat)</option>
                            <option value="7">星期日 (Sun)</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">開始時間</label>
                            <select id="startTime" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">結束時間</label>
                            <select id="endTime" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
                        </div>
                    </div>

                    <button onclick="addCourse()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition duration-200 cursor-pointer text-center">
                        加入時間表
                    </button>
                </div>

                <div class="mt-6 border-t border-slate-100 pt-4">
                    <h3 class="text-sm font-bold text-slate-700 mb-2">已加課程</h3>
                    <ul id="courseList" class="space-y-2 max-h-48 overflow-y-auto text-xs">
                        </ul>
                </div>
            </div>

            <div class="xl:col-span-3">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-4">
                    <span class="text-xs text-slate-500">⚠️ 同一時段重複加課會觸發紅色撞堂警告。</span>
                    <button onclick="downloadTimetable()" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition cursor-pointer text-center">
                        📸 下載時間表截圖
                    </button>
                </div>

                <div id="timetableCapture" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 overflow-x-auto">
                    <div class="timetable-grid border-b border-slate-200 pb-2 text-center font-bold text-slate-700 text-xs gap-1">
                        <div>時間</div>
                        <div class="text-blue-600">Mon</div>
                        <div class="text-blue-600">Tue</div>
                        <div class="text-blue-600">Wed</div>
                        <div class="text-blue-600">Thu</div>
                        <div class="text-blue-600">Fri</div>
                        <div class="text-amber-600">Sat</div>
                        <div class="text-amber-600">Sun</div>
                    </div>

                    <div id="timetableRows" class="divide-y divide-slate-100">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 生成半小時時間選項 (9.0 代表 09:00, 9.5 代表 09:30)
        const startSelect = document.getElementById('startTime');
        const endSelect = document.getElementById('endTime');
        
        function formatTime(val) {
            let h = Math.floor(val);
            let m = (val % 1 === 0) ? '00' : '30';
            return `${h < 10 ? '0' + h : h}:${m}`;
        }

        for(let i = 9; i <= 18.5; i += 0.5) {
            startSelect.options.add(new Option(formatTime(i), i));
            endSelect.options.add(new Option(formatTime(i + 0.5), i + 0.5));
        }
        endSelect.value = 12; // 預設結束時間

        let courses = [];

        // 點擊課表格子觸發：自動代入星期和時間
        function selectSlot(day, timeValue) {
            document.getElementById('courseDay').value = day;
            document.getElementById('startTime').value = timeValue;
            document.getElementById('endTime').value = timeValue + 1; // 預設選 1 小時堂
            document.getElementById('courseName').focus();
        }

        // 渲染課表
        function renderTimetable() {
            const rowsContainer = document.getElementById('timetableRows');
            rowsContainer.innerHTML = '';

            for (let time = 9; time <= 18.5; time += 0.5) {
                const row = document.createElement('div');
                row.className = 'timetable-grid min-h-[45px] items-stretch text-center text-[11px] gap-1';
                
                // 時間標籤
                const timeLabel = document.createElement('div');
                timeLabel.className = 'flex items-center justify-center border-r border-slate-100 text-slate-400 font-mono bg-slate-50';
                timeLabel.innerText = formatTime(time);
                row.appendChild(timeLabel);

                // 7日網格
                for (let day = 1; day <= 7; day++) {
                    const cell = document.createElement('div');
                    
                    // 篩選出覆蓋目前半小時時段的課程
                    const slotCourses = courses.filter(c => c.day == day && time >= c.start && time < c.end);

                    if (slotCourses.length > 0) {
                        if (slotCourses.length > 1) {
                            cell.className = 'p-1 bg-red-50 text-red-700 font-semibold border border-red-300 rounded flex items-center justify-center';
                            cell.innerHTML = `⚠️ 撞堂!`;
                        } else {
                            cell.className = 'p-1 bg-blue-50 text-blue-700 border border-blue-100 rounded flex items-center justify-center font-medium';
                            cell.innerHTML = `<span>${slotCourses[0].name}</span>`;
                        }
                    } else {
                        // 空白網格：可以點擊
                        cell.className = 'p-1 hover:bg-slate-100 text-transparent hover:text-slate-400 transition cursor-pointer flex items-center justify-center border border-dashed border-slate-100 rounded';
                        cell.innerText = '＋';
                        cell.setAttribute('onclick', `selectSlot(${day}, ${time})`);
                    }
                    row.appendChild(cell);
                }
                rowsContainer.appendChild(row);
            }
        }

        // 新增課程
        function addCourse() {
            const name = document.getElementById('courseName').value.trim();
            const day = document.getElementById('courseDay').value;
            const start = parseFloat(document.getElementById('startTime').value);
            const end = parseFloat(document.getElementById('endTime').value);

            if (!name) {
                alert('請輸入課程名稱！');
                return;
            }
            if (start >= end) {
                alert('結束時間必須遲過開始時間！');
                return;
            }

            const newCourse = { id: Date.now(), name, day, start, end };
            courses.push(newCourse);
            
            document.getElementById('courseName').value = '';
            updateUI();
        }

        // 刪除課程
        function deleteCourse(id) {
            courses = courses.filter(c => c.id !== id);
            updateUI();
        }

        // 更新數據
        function updateUI() {
            renderTimetable();
            
            const list = document.getElementById('courseList');
            list.innerHTML = '';
            
            const dayNames = ['', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            courses.forEach(c => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center bg-slate-100 p-2 rounded-lg';
                li.innerHTML = `
                    <span class="truncate mr-1"><strong>${c.name}</strong><br><span class="text-slate-500">${dayNames[c.day]} ${formatTime(c.start)}-${formatTime(c.end)}</span></span>
                    <button onclick="deleteCourse(${c.id})" class="text-red-500 hover:text-red-700 font-bold px-1 cursor-pointer">❌</button>
                `;
                list.appendChild(li);
            });
        }

        function downloadTimetable() {
            const target = document.getElementById('timetableCapture');
            html2canvas(target).then(canvas => {
                const link = document.createElement('a');
                link.download = 'my-timetable.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        renderTimetable();
    </script>
</body>
</html>
