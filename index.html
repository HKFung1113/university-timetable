<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自訂行程時間表 / Weekly Schedule Planner</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        .timetable-main-grid {
            display: grid;
            grid-template-columns: 90px repeat(7, minmax(110px, 1fr));
        }
    </style>
</head>
<body id="body" class="bg-slate-50 text-slate-900 font-sans p-3 sm:p-6 md:p-8 transition-colors duration-200 min-h-screen">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <div class="flex flex-wrap justify-end items-center gap-3">
            <button onclick="toggleDarkMode()" id="btn-dark" class="px-4 py-1.5 text-xs font-semibold rounded-xl border border-slate-300 bg-slate-900 text-white cursor-pointer flex items-center gap-1.5 shadow-sm hover:scale-105 transition">
                🌙 <span id="txt-dark-btn">黑夜模式</span>
            </button>
            <div class="h-5 w-[1px] bg-slate-300"></div>
            <button onclick="changeLang('zh')" id="btn-zh" class="px-3.5 py-1.5 text-xs font-semibold rounded-xl border bg-blue-600 text-white cursor-pointer shadow-sm">繁體中文</button>
            <button onclick="changeLang('cn')" id="btn-cn" class="px-3.5 py-1.5 text-xs font-semibold rounded-xl border bg-white text-slate-600 hover:bg-slate-100 cursor-pointer shadow-sm">简体中文</button>
            <button onclick="changeLang('en')" id="btn-en" class="px-3.5 py-1.5 text-xs font-semibold rounded-xl border bg-white text-slate-600 hover:bg-slate-100 cursor-pointer shadow-sm">English</button>
        </div>

        <div class="text-center py-2">
            <h1 id="txt-title" class="text-3xl sm:text-4xl font-extrabold mb-2 tracking-tight">📅 自訂行程時間表</h1>
            <p id="txt-subtitle" class="text-sm sm:text-base text-slate-600 font-medium">網格支援【直接點擊】！輕鬆規劃你的完美每週行程！</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
            <div id="panel-filter" class="bg-white p-5 rounded-2xl shadow-md border border-slate-200/80 transition-all flex flex-col justify-between gap-4">
                <div>
                    <h3 id="txt-filter-title" class="text-base font-bold mb-3 flex items-center gap-2 text-slate-900">⏰ 顯示時間範圍 (24h)</h3>
                    <div class="grid grid-cols-2 gap-4 text-sm">
                        <div>
                            <label id="lbl-filter-start" class="block text-slate-500 font-medium mb-1.5">開始時間</label>
                            <select id="filterStartTime" onchange="updateTimeFilter()" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-slate-900 font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm"></select>
                        </div>
                        <div>
                            <label id="lbl-filter-end" class="block text-slate-500 font-medium mb-1.5">結束時間</label>
                            <select id="filterEndTime" onchange="updateTimeFilter()" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-slate-900 font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm"></select>
                        </div>
                    </div>
                </div>
                
                <div class="border-t border-slate-100 pt-3 flex flex-wrap gap-2">
                    <button onclick="exportJSON()" id="btn-export" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-bold rounded-xl transition cursor-pointer border-none shadow-sm">💾 備份 JSON</button>
                    <button onclick="triggerImport()" id="btn-import" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-bold rounded-xl transition cursor-pointer border-none shadow-sm">📂 匯入備份</button>
                    <button onclick="clearAllCourses()" id="btn-clear" class="px-2.5 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 text-[11px] font-bold rounded-xl transition cursor-pointer border-none shadow-sm ml-auto">🗑️ 清空</button>
                    <input type="file" id="importFile" accept=".json" onchange="importJSON(event)" class="hidden">
                </div>
            </div>

            <div id="panel-list" class="bg-white p-5 rounded-2xl shadow-md border border-slate-200/80 transition-all">
                <h2 id="txt-list-title" class="text-base font-bold mb-1 text-slate-900">📝 我的每週行程一覽</h2>
                <p id="txt-list-tip" class="text-[11px] text-slate-400 mb-2 font-medium">💡 點擊可修改。**可直接拖曳下方清單中的行程投放到時間表空格！**</p>
                <ul id="courseList" class="space-y-2 max-h-[135px] overflow-y-auto pr-1 text-sm">
                    </ul>
            </div>

            <div id="panel-notes" class="bg-white p-5 rounded-2xl shadow-md border border-slate-200/80 transition-all w-full flex flex-col justify-between">
                <h3 id="txt-notes-title" class="text-base font-bold mb-1.5 text-slate-900">📌 本週備忘錄 / 週計畫 To-Do</h3>
                <textarea id="weeklyNotes" oninput="saveNotes()" rows="4" placeholder="在此輸入本週待辦事項、考試重點或生活備忘錄...（資料會自動儲存）" class="w-full flex-1 p-3 border border-slate-300 rounded-xl bg-white text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-xs sm:text-sm transition-all resize-none"></textarea>
            </div>
        </div>

        <div class="w-full space-y-3 pt-4 mx-auto">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <span id="txt-clash-alert" class="text-xs sm:text-sm text-slate-500 font-medium">⚠️ 同一時段重複加行程會觸發紅色撞時間警告。</span>
                <button onclick="downloadTimetable()" id="btn-screenshot" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl shadow-md hover:shadow-lg transition cursor-pointer text-center border-none">
                    📸 下載時間表截圖
                </button>
            </div>

            <div id="timetableCapture" class="bg-white p-5 rounded-2xl shadow-md border border-slate-200/80 overflow-x-auto w-full transition-all">
                <div class="timetable-main-grid min-w-[860px]">
                    <div id="th-time" class="p-2.5 text-center font-extrabold text-slate-500 border-b border-slate-200 text-xs sm:text-sm">時間</div>
                    <div id="th-mon" class="p-2.5 text-center font-bold text-slate-900 border-b border-slate-200 text-xs sm:text-sm">Mon</div>
                    <div id="th-tue" class="p-2.5 text-center font-bold text-slate-900 border-b border-slate-200 text-xs sm:text-sm">Tue</div>
                    <div id="th-wed" class="p-2.5 text-center font-bold text-slate-900 border-b border-slate-200 text-xs sm:text-sm">Wed</div>
                    <div id="th-thu" class="p-2.5 text-center font-bold text-slate-700 border-b border-slate-200 text-xs sm:text-sm">Thu</div>
                    <div id="th-fri" class="p-2.5 text-center font-bold text-slate-700 border-b border-slate-200 text-xs sm:text-sm">Fri</div>
                    <div id="th-sat" class="p-2.5 text-center font-bold text-amber-600 border-b border-slate-200 text-xs sm:text-sm">Sat</div>
                    <div id="th-sun" class="p-2.5 text-center font-bold text-amber-600 border-b border-slate-200 text-xs sm:text-sm">Sun</div>

                    <div id="timetableGridBody" class="contents">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <div id="courseModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div id="modalBox" class="bg-white rounded-2xl p-6 sm:p-8 max-w-md w-full shadow-2xl border border-slate-200 transform transition-all scale-100 text-slate-900">
            <h3 id="modal-title" class="text-xl font-extrabold mb-5">➕ 新增行程資料</h3>
            
            <div class="space-y-5">
                <div>
                    <label id="modal-label-name" class="block text-sm font-semibold text-slate-500 mb-1.5">項目 / 行程名稱</label>
                    <input type="text" id="modalCourseName" placeholder="" class="w-full px-3 py-3 border border-slate-300 rounded-xl bg-white text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-sm sm:text-base">
                </div>

                <div>
                    <label id="modal-label-day" class="block text-sm font-semibold text-slate-500 mb-1.5">星期幾</label>
                    <select id="modalCourseDay" class="w-full px-3 py-3 border border-slate-300 rounded-xl bg-white text-slate-900 font-medium text-sm sm:text-base">
                        <option value="1">星期一 (Mon)</option>
                        <option value="2">星期二 (Tue)</option>
                        <option value="3">星期三 (Wed)</option>
                        <option value="4">星期四 (Thu)</option>
                        <option value="5">星期五 (Fri)</option>
                        <option value="6">星期六 (Sat)</option>
                        <option value="7">星期日 (Sun)</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label id="modal-label-start" class="block text-sm font-semibold text-slate-500 mb-1.5">開始時間</label>
                        <select id="modalStartTime" onchange="onModalStartChange()" class="w-full px-3 py-3 border border-slate-300 rounded-xl bg-white text-slate-900 font-medium text-sm sm:text-base"></select>
                    </div>
                    <div>
                        <label id="modal-label-end" class="block text-sm font-semibold text-slate-500 mb-1.5">結束時間</label>
                        <select id="modalEndTime" class="w-full px-3 py-3 border border-slate-300 rounded-xl bg-white text-slate-900 font-medium text-sm sm:text-base"></select>
                    </div>
                </div>

                <div class="flex gap-3 pt-3">
                    <button onclick="closeModal()" id="btn-modal-cancel" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl cursor-pointer text-center text-sm transition border-none">
                        取消
                    </button>
                    <button onclick="saveModalCourse()" id="btn-modal-confirm" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl cursor-pointer text-center text-sm transition shadow border-none">
                        確認加入
                    </button>
                </div>
            </div>
        </div>
    </div>

                btnConfirmEdit: "Save Changes",
                placeholder: "e.g., Tutor / Part-time / Study",

                notesTitle: "📌 Weekly Notes / To-Do List",
                notesPlaceholder: "Enter weekly notes, exam topics, or tasks here... (Auto-saves)",
                days: ['', 'Monday (Mon)', 'Tuesday (Tue)', 'Wednesday (Wed)', 'Thursday (Thu)', 'Friday (Fri)', 'Saturday (Sat)', 'Sunday (Sun)']
            }
        };

        const colorPalette = [
            { light: 'bg-blue-50 text-blue-700 border-blue-200', dark: 'bg-blue-950/90 text-blue-100 border-blue-700' },
            { light: 'bg-emerald-50 text-emerald-700 border-emerald-200', dark: 'bg-emerald-950/90 text-emerald-100 border-emerald-700' },
            { light: 'bg-purple-50 text-purple-700 border-purple-200', dark: 'bg-purple-950/90 text-purple-100 border-purple-700' },
            { light: 'bg-orange-50 text-orange-700 border-orange-200', dark: 'bg-orange-950/90 text-orange-100 border-orange-700' },
            { light: 'bg-fuchsia-50 text-fuchsia-700 border-fuchsia-200', dark: 'bg-fuchsia-950/90 text-fuchsia-100 border-fuchsia-700' }
        ];

        let currentLang = 'zh';
        let courses = [];
        let isDarkMode = false;
        let editingCourseId = null;
        
        let displayStart = 9;
        let displayEnd = 21;

        const startSelect = document.getElementById('modalStartTime');
        const endSelect = document.getElementById('modalEndTime');
        const filterStartSel = document.getElementById('filterStartTime');
        const filterEndSel = document.getElementById('filterEndTime');
        
        function formatTime(val) {
            let h = Math.floor(val);
            let m = (val % 1 === 0) ? '00' : '30';
            return `${h < 10 ? '0' + h : h}:${m}`;
        }

        function checkIsClashed(course) {
            return courses.some(c => 
                c.id !== course.id && 
                c.day === course.day && 
                ((course.start >= c.start && course.start < c.end) || 
                 (course.end > c.start && course.end <= c.end) || 
                 (course.start <= c.start && course.end >= c.end))
            );
        }

        function loadFromLocalStorage() {
            const savedCourses = localStorage.getItem('timetable_courses');
            const savedStart = localStorage.getItem('timetable_displayStart');
            const savedEnd = localStorage.getItem('timetable_displayEnd');
            const savedDark = localStorage.getItem('timetable_isDarkMode');
            const savedLang = localStorage.getItem('timetable_lang');
            const savedNotes = localStorage.getItem('timetable_notes');

            if (savedCourses) courses = JSON.parse(savedCourses);
            if (savedStart) displayStart = parseFloat(savedStart);
            if (savedEnd) displayEnd = parseFloat(savedEnd);
            if (savedLang) currentLang = savedLang;
            if (savedNotes) document.getElementById('weeklyNotes').value = savedNotes;
            
            initTimeDropdowns();

            if (savedDark === 'true') {
                isDarkMode = false; 
                toggleDarkMode();
            } else {
                changeLang(currentLang);
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('timetable_courses', JSON.stringify(courses));
            localStorage.setItem('timetable_displayStart', displayStart);
            localStorage.setItem('timetable_displayEnd', displayEnd);
            localStorage.setItem('timetable_isDarkMode', isDarkMode);
            localStorage.setItem('timetable_lang', currentLang);
        }

        function saveNotes() {
            const txt = document.getElementById('weeklyNotes').value;
            localStorage.setItem('timetable_notes', txt);
        }

        function initTimeDropdowns() {
            startSelect.innerHTML = '';
            filterStartSel.innerHTML = '';
            filterEndSel.innerHTML = '';
            
            for(let i = 0; i <= 23.5; i += 0.5) {
                startSelect.options.add(new Option(formatTime(i), i));
                filterStartSel.options.add(new Option(formatTime(i), i));
            }
            for(let i = 0; i <= 24; i += 0.5) {
                filterEndSel.options.add(new Option(formatTime(i), i));
            }
            
            filterStartSel.value = displayStart;
            filterEndSel.value = displayEnd;
        }

        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            const body = document.getElementById('body');
            const darkBtnText = document.getElementById('txt-dark-btn');
            const btnDark = document.getElementById('btn-dark');
            const panelFilter = document.getElementById('panel-filter');
            const panelList = document.getElementById('panel-list');
            const timetableCapture = document.getElementById('timetableCapture');
            const modalBox = document.getElementById('modalBox');
            const txtSubtitle = document.getElementById('txt-subtitle');
            const txtTitle = document.getElementById('txt-title');
            const txtClashAlert = document.getElementById('txt-clash-alert');
            const filterTitle = document.getElementById('txt-filter-title');
            const listTitle = document.getElementById('txt-list-title');
            const panelNotes = document.getElementById('panel-notes');
            const notesTitle = document.getElementById('txt-notes-title');

            if (isDarkMode) {
                body.className = "bg-slate-950 text-white font-sans p-3 sm:p-6 md:p-8 transition-colors duration-200 min-h-screen";
                btnDark.className = "px-4 py-1.5 text-xs font-semibold rounded-xl border border-slate-700 bg-white text-black cursor-pointer flex items-center gap-1.5 shadow-sm hover:scale-105 transition";
                darkBtnText.innerText = langPack[currentLang].darkBtnOff;
                
                txtTitle.className = "text-3xl sm:text-4xl font-extrabold mb-3 tracking-tight text-white";
                txtSubtitle.className = "text-sm sm:text-base text-slate-200 font-medium";
                txtClashAlert.className = "text-xs sm:text-sm text-slate-300 font-medium";

                panelFilter.className = "bg-slate-900/90 p-5 rounded-2xl shadow-xl border border-slate-800 text-white transition-all flex flex-col justify-between gap-4";
                panelList.className = "bg-slate-900/90 p-5 rounded-2xl shadow-xl border border-slate-800 text-white transition-all";
                timetableCapture.className = "bg-slate-900/80 backdrop-blur-md p-5 rounded-2xl shadow-xl border border-slate-800/80 overflow-x-auto w-full transition-all";
                modalBox.className = "bg-slate-900 rounded-2xl p-6 sm:p-8 max-w-md w-full shadow-2xl border border-slate-800 transform transition-all scale-100 text-white";
                panelNotes.className = "bg-slate-900/90 p-5 rounded-2xl shadow-xl border border-slate-800 transition-all w-full text-white flex flex-col justify-between";

                filterTitle.className = "text-base font-bold mb-3 flex items-center gap-2 text-white";
                listTitle.className = "text-base font-bold mb-1 text-white";
                notesTitle.className = "text-base font-bold mb-1.5 text-white";

                ['time', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'].forEach(d => {
                    const el = document.getElementById(`th-${d}`);
                    if (el) el.className = `p-2.5 text-center font-bold text-white border-b border-slate-800 text-xs sm:text-sm ${d=='time'?'font-extrabold':''}`;
                });
            } else {
                body.className = "bg-slate-50 text-slate-900 font-sans p-3 sm:p-6 md:p-8 transition-colors duration-200 min-h-screen";
                btnDark.className = "px-4 py-1.5 text-xs font-semibold rounded-xl border border-slate-300 bg-slate-900 text-white cursor-pointer flex items-center gap-1.5 shadow-sm hover:scale-105 transition";
                darkBtnText.innerText = langPack[currentLang].darkBtnOn;
                
                txtTitle.className = "text-3xl sm:text-4xl font-extrabold mb-3 tracking-tight text-slate-900";
                txtSubtitle.className = "text-sm sm:text-base text-slate-600 font-medium";
                txtClashAlert.className = "text-xs sm:text-sm text-slate-500 font-medium";

                panelFilter.className = "bg-white p-5 rounded-2xl shadow-md border border-slate-200/80 text-slate-900 transition-all flex flex-col justify-between gap-4";
                panelList.className = "bg-white p-5 rounded-2xl shadow-md border border-slate-200/80 text-slate-900 transition-all";
                timetableCapture.className = "bg-white p-5 rounded-2xl shadow-md border border-slate-200/80 overflow-x-auto w-full transition-all";
                modalBox.className = "bg-white rounded-2xl p-6 sm:p-8 max-w-md w-full shadow-2xl border border-slate-200 transform transition-all scale-100 text-slate-900";
                panelNotes.className = "bg-white p-5 rounded-2xl shadow-md border border-slate-200/80 transition-all w-full text-slate-900 flex flex-col justify-between";

                filterTitle.className = "text-base font-bold mb-3 flex items-center gap-2 text-slate-900";
                listTitle.className = "text-base font-bold mb-1 text-slate-900";
                notesTitle.className = "text-base font-bold mb-1.5 text-slate-900";

                document.getElementById('th-time').className = "p-2.5 text-center font-extrabold text-slate-500 border-b border-slate-200 text-xs sm:text-sm";
                // 【白天模式修正】：將 Mon, Tue, Wed 統一調整為更沉穩的黑色 text-slate-900
                ['mon', 'tue', 'wed'].forEach(d => document.getElementById(`th-${d}`).className = "p-2.5 text-center font-bold text-slate-900 border-b border-slate-200 text-xs sm:text-sm");
                ['thu', 'fri'].forEach(d => document.getElementById(`th-${d}`).className = "p-2.5 text-center font-bold text-slate-700 border-b border-slate-200 text-xs sm:text-sm");
                ['sat', 'sun'].forEach(d => document.getElementById(`th-${d}`).className = "p-2.5 text-center font-bold text-amber-600 border-b border-slate-200 text-xs sm:text-sm");
            }
            
            updateDropdownStyles();
            renderTimetable();
            updateUI();
            saveToLocalStorage();
        }

        function updateDropdownStyles() {
            const allSelectsInputs = document.querySelectorAll('select, input[type="text"], textarea');
            allSelectsInputs.forEach(el => {
                if (isDarkMode) {
                    el.className = "w-full px-3 py-2 border rounded-xl bg-white text-slate-950 border-slate-400 font-semibold focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm resize-none";
                } else {
                    el.className = "w-full px-3 py-2 border rounded-xl bg-white text-slate-900 border-slate-300 font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm resize-none";
                }
            });
        }

        function updateTimeFilter() {
            let start = parseFloat(filterStartSel.value);
            let end = parseFloat(filterEndSel.value);
            
            if (start >= end) {
                alert(langPack[currentLang].alertTimeOrder);
                filterStartSel.value = displayStart;
                filterEndSel.value = displayEnd;
                return;
            }
            
            displayStart = start;
            displayEnd = end;
            renderTimetable();
            saveToLocalStorage();
        }

        function changeLang(lang) {
            currentLang = lang;
            const p = langPack[lang];
            
            document.getElementById('txt-title').innerText = p.title;
            document.getElementById('txt-subtitle').innerText = p.subtitle;
            document.getElementById('txt-list-title').innerText = p.listTitle;
            document.getElementById('txt-list-tip').innerText = p.listTip;
            document.getElementById('txt-clash-alert').innerText = p.clashAlert;
            document.getElementById('btn-screenshot').innerText = p.screenshot;
            document.getElementById('th-time').innerText = p.time;
            
            document.getElementById('txt-filter-title').innerText = p.filterTitle;
            document.getElementById('lbl-filter-start').innerText = p.filterStart;
            document.getElementById('lbl-filter-end').innerText = p.filterEnd;
            document.getElementById('txt-dark-btn').innerText = isDarkMode ? p.darkBtnOff : p.darkBtnOn;
            
            document.getElementById('modal-label-name').innerText = p.labelName;
            document.getElementById('modal-label-day').innerText = p.labelDay;
            document.getElementById('modal-label-start').innerText = p.labelStart;
            document.getElementById('modal-label-end').innerText = p.labelEnd;
            document.getElementById('btn-modal-cancel').innerText = p.btnCancel;
            document.getElementById('modalCourseName').placeholder = p.placeholder;

            document.getElementById('txt-notes-title').innerText = p.notesTitle;
            document.getElementById('weeklyNotes').placeholder = p.notesPlaceholder;

            if(editingCourseId) {
                document.getElementById('modal-title').innerText = p.modalTitleEdit;
                document.getElementById('btn-modal-confirm').innerText = p.btnConfirmEdit;
            } else {
                document.getElementById('modal-title').innerText = p.modalTitleAdd;
                document.getElementById('btn-modal-confirm').innerText = p.btnConfirmAdd;
            }

            ['zh', 'cn', 'en'].forEach(l => {
                const btn = document.getElementById(`btn-${l}`);
                if (l === lang) {
                    btn.className = "px-3.5 py-1.5 text-xs font-semibold rounded-xl border bg-blue-600 text-white cursor-pointer shadow-sm";
                } else {
                    btn.className = isDarkMode 
                        ? "px-3.5 py-1.5 text-xs font-semibold rounded-xl border border-slate-700 bg-slate-900 text-white cursor-pointer shadow-sm hover:bg-slate-800"
                        : "px-3.5 py-1.5 text-xs font-semibold rounded-xl border bg-white text-slate-600 hover:bg-slate-100 cursor-pointer shadow-sm";
                }
            });

            const daySelect = document.getElementById('modalCourseDay');
            for(let i=1; i<=7; i++) {
                daySelect.options[i-1].text = p.days[i];
            }

            updateUI();
            saveToLocalStorage();
        }

        function onModalStartChange() {
            const currentStart = parseFloat(startSelect.value);
            const savedEndValue = parseFloat(endSelect.value);
            
            endSelect.innerHTML = '';
            for(let i = currentStart + 0.5; i <= 24; i += 0.5) {
                endSelect.options.add(new Option(formatTime(i), i));
            }
            
            if (savedEndValue > currentStart) {
                endSelect.value = savedEndValue;
            } else {
                endSelect.value = currentStart + 1.0 <= 24 ? currentStart + 1.0 : currentStart + 0.5;
            }
        }

        function openModal(day, timeValue, courseId = null) {
            editingCourseId = courseId;
            const p = langPack[currentLang];

            if (editingCourseId) {
                document.getElementById('modal-title').innerText = p.modalTitleEdit;
                document.getElementById('btn-modal-confirm').innerText = p.btnConfirmEdit;
                
                const target = courses.find(c => c.id === courseId);
                if (target) {
                    document.getElementById('modalCourseName').value = target.name;
                    document.getElementById('modalCourseDay').value = target.day;
                    startSelect.value = target.start;
                    
                    endSelect.innerHTML = '';
                    for(let i = target.start + 0.5; i <= 24; i += 0.5) {
                        endSelect.options.add(new Option(formatTime(i), i));
                    }
                    endSelect.value = target.end;
                }
            } else {
                document.getElementById('modal-title').innerText = p.modalTitleAdd;
                document.getElementById('btn-modal-confirm').innerText = p.btnConfirmAdd;
                
                document.getElementById('modalCourseDay').value = day;
                startSelect.value = timeValue;
                onModalStartChange();
            }

            updateDropdownStyles();
            document.getElementById('courseModal').classList.remove('hidden');
            document.getElementById('modalCourseName').focus();
        }

        function closeModal() {
            document.getElementById('courseModal').classList.add('hidden');
            document.getElementById('modalCourseName').value = '';
            editingCourseId = null;
        }

        function saveModalCourse() {
            const name = document.getElementById('modalCourseName').value.trim();
            const day = parseInt(document.getElementById('modalCourseDay').value);
            const start = parseFloat(startSelect.value);
            const end = parseFloat(endSelect.value);

            if (!name) {
                alert(langPack[currentLang].alertInput);
                return;
            }
            if (start >= end) {
                alert(langPack[currentLang].alertTimeOrder);
                return;
            }

            if (editingCourseId) {
                const target = courses.find(c => c.id === editingCourseId);
                if (target) {
                    target.name = name;
                    target.day = day;
                    target.start = start;
                    target.end = end;
                }
            } else {
                const randomColorIndex = Math.floor(Math.random() * colorPalette.length);
                courses.push({ id: Date.now(), name, day, start, end, colorIndex: randomColorIndex });
            }

            closeModal();
            updateUI();
        }

        function handleDragStart(e, id) {
            e.dataTransfer.setData("text/plain", id);
            e.dataTransfer.effectAllowed = "move";
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
        }

        function handleDrop(e, targetDay, targetTime) {
            e.preventDefault();
            const id = parseInt(e.dataTransfer.getData("text/plain"));
            const targetCourse = courses.find(c => c.id === id);
            
            if (targetCourse) {
                const duration = targetCourse.end - targetCourse.start;
                targetCourse.day = targetDay;
                targetCourse.start = targetTime;
                targetCourse.end = targetTime + duration;
                
                if (targetCourse.end > 24) {
                    targetCourse.end = 24;
                }
                
                updateUI();
            }
        }

        function renderTimetable() {
            const gridBody = document.getElementById('timetableGridBody');
            gridBody.innerHTML = '';

            const borderStyle = isDarkMode ? 'border-slate-800' : 'border-slate-200/60';
            const cellOccupied = {};
            let rowIndex = 2; 
            
            for (let time = displayStart; time <= displayEnd; time += 0.5) {
                const isLastRow = (time === displayEnd);

                if (!isLastRow) {
                    const timeLabel = document.createElement('div');
                    timeLabel.className = isDarkMode
                        ? 'flex items-center justify-center p-2 border-b border-r border-slate-800 text-white font-mono font-bold bg-slate-950/80 min-h-[55px]'
                        : 'flex items-center justify-center p-2 border-b border-r border-slate-200/60 text-slate-500 font-mono font-bold bg-slate-50/50 min-h-[55px]';
                    timeLabel.style.gridColumn = "1";
                    timeLabel.style.gridRow = `${rowIndex}`;
                    timeLabel.innerText = formatTime(time);
                    gridBody.appendChild(timeLabel);
                }

                for (let day = 1; day <= 7; day++) {
                    const cellKey = `${day}-${time}`;
                    
                    if (cellOccupied[cellKey]) {
                        continue; 
                    }

                    if (isLastRow) {
                        continue; 
                    }

                    const slotCourses = courses.filter(c => c.day == day && time >= c.start && time < c.end).sort((a,b) => a.id - b.id);
                    
                    const cell = document.createElement('div');
                    cell.setAttribute('ondragover', 'handleDragOver(event)');
                    cell.setAttribute('ondrop', `handleDrop(event, ${day}, ${time})`);
                    cell.style.gridColumn = `${day + 1}`;

                    if (slotCourses.length > 0) {
                        const mainCourse = slotCourses[0];
                        const anyClashInGroup = slotCourses.length > 1 || checkIsClashed(mainCourse);

                        if (time === Math.max(mainCourse.start, displayStart)) {
                            const renderStart = Math.max(mainCourse.start, displayStart);
                            const renderEnd = Math.min(mainCourse.end, displayEnd);
                            const slotsCount = (renderEnd - renderStart) / 0.5;

                            cell.style.gridRow = `${rowIndex} / span ${slotsCount}`;
                            cell.className = `p-1 flex flex-col items-slate-stretch justify-center border-b ${borderStyle}`;

                            for (let t = renderStart; t < renderEnd; t += 0.5) {
                                cellOccupied[`${day}-${t}`] = true;
                            }

                            const subItem = document.createElement('div');
                            
                            if (anyClashInGroup) {
                                subItem.className = isDarkMode 
                                    ? 'w-full h-full bg-red-950/90 text-red-200 border-2 border-red-500 rounded-xl flex items-center justify-center p-2 font-bold text-center cursor-pointer shadow-md hover:scale-[1.01] transition-all break-all min-h-[46px]'
                                    : 'w-full h-full bg-red-50 text-red-700 border-2 border-red-400 rounded-xl flex items-center justify-center p-2 font-bold text-center cursor-pointer shadow-md hover:scale-[1.01] transition-all break-all min-h-[46px]';
                            } else {
                                const themeColors = colorPalette[mainCourse.colorIndex || 0];
                                const currentThemeClass = isDarkMode ? themeColors.dark : themeColors.light;
                                subItem.className = `w-full h-full border rounded-xl flex items-center justify-center p-2 font-bold text-center cursor-pointer shadow-md hover:scale-[1.01] transition-all break-all min-h-[46px]`;
                                subItem.classList.add(...currentThemeClass.split(' '));
                            }

                            subItem.innerHTML = `<span>${mainCourse.name}</span>`;
                            subItem.setAttribute('onclick', `openModal(null, null, ${mainCourse.id})`);
                            cell.appendChild(subItem);
                        } else {
                            continue;
                        }
                    } else {
                        cell.className = `p-1 border-b border-r ${borderStyle} min-h-[55px] flex items-slate-stretch justify-center`;
                        cell.style.gridRow = `${rowIndex}`;

                        const addBtn = document.createElement('div');
                        addBtn.className = isDarkMode
                            ? 'w-full h-full hover:bg-slate-800 text-transparent hover:text-white transition-all cursor-pointer flex items-center justify-center border border-dashed border-slate-800 hover:border-slate-600 rounded-xl font-extrabold text-base'
                            : 'w-full h-full hover:bg-slate-100 text-transparent hover:text-slate-400 transition-all cursor-pointer flex items-center justify-center border border-dashed border-slate-200 hover:border-slate-400 rounded-xl font-extrabold text-base';
                        addBtn.innerText = '＋';
                        addBtn.setAttribute('onclick', `openModal(${day}, ${time})`);
                        
                        cell.appendChild(addBtn);
                    }
                    gridBody.appendChild(cell);
                }
                rowIndex++;
            }
        }

        function deleteCourse(id) {
            courses = courses.filter(c => c.id !== id);
            updateUI();
        }

        function clearAllCourses() {
            if (confirm(langPack[currentLang].confirmClear)) {
                courses = [];
                updateUI();
            }
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(courses));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "timetable_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function triggerImport() {
            document.getElementById('importFile').click();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        courses = imported;
                        updateUI();
                    } else {
                        alert(langPack[currentLang].alertImportFail);
                    }
                } catch (err) {
                    alert(langPack[currentLang].alertImportFail);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function updateUI() {
            renderTimetable();
            const list = document.getElementById('courseList');
            list.innerHTML = '';
            
            courses.forEach(c => {
                const li = document.createElement('li');
                const isClashed = checkIsClashed(c);

                let textColorClass = isDarkMode ? 'text-white' : 'text-slate-900';
                let subColorClass = isDarkMode ? 'text-slate-400' : 'text-slate-500';
                let borderClashClass = isDarkMode ? 'border-slate-800 bg-slate-950 hover:border-slate-700' : 'border-slate-100 bg-slate-50 hover:border-slate-200';

                if (isClashed) {
                    textColorClass = 'text-red-500 font-extrabold';
                    subColorClass = 'text-red-400 font-bold';
                    borderClashClass = isDarkMode ? 'border-red-900/80 bg-red-950/40' : 'border-red-200 bg-red-50/60';
                }

                li.setAttribute('draggable', 'true');
                li.setAttribute('ondragstart', `handleDragStart(event, ${c.id})`);
                li.className = `flex justify-between items-center p-2 rounded-xl border shadow-sm cursor-move active:opacity-50 transition-all duration-150 ${borderClashClass}`;
                
                li.innerHTML = `
                    <span class="truncate mr-2 flex-1 font-medium cursor-pointer" onclick="openModal(null, null, ${c.id})">
                        <strong class="text-xs sm:text-sm ${textColorClass}">☰ ${c.name}</strong>
                        <span class="text-[11px] font-semibold ${subColorClass} ml-2">(${langPack[currentLang].days[c.day].split(' ')[0]} ${formatTime(c.start)}-${formatTime(c.end)})</span>
                    </span>
                    <button onclick="deleteCourse(${c.id}); event.stopPropagation();" class="text-red-400 hover:text-red-600 font-bold px-1 cursor-pointer border-none bg-transparent text-xs sm:text-sm transition">❌</button>
                `;
                list.appendChild(li);
            });
            saveToLocalStorage();
        }

        function downloadTimetable() {
            const target = document.getElementById('timetableCapture');
            html2canvas(target).then(canvas => {
                const link = document.createElement('a');
                link.download = 'my-timetable.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        loadFromLocalStorage();
    </script>
</body>
</html>
