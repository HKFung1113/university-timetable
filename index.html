<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自訂行程時間表 / Weekly Schedule Planner</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        .timetable-grid {
            display: grid;
            grid-template-columns: 90px repeat(7, minmax(110px, 1fr));
        }
    </style>
</head>
<body id="body" class="bg-slate-50 text-slate-900 font-sans p-3 sm:p-6 md:p-8 transition-colors duration-200 min-h-screen">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <div class="flex flex-wrap justify-end items-center gap-3">
            <button onclick="toggleDarkMode()" id="btn-dark" class="px-4 py-1.5 text-xs font-semibold rounded-xl border border-slate-300 bg-slate-900 text-white cursor-pointer flex items-center gap-1.5 shadow-sm hover:scale-105 transition">
                🌙 <span id="txt-dark-btn">黑夜模式</span>
            </button>
            <div class="h-5 w-[1px] bg-slate-300"></div>
            <button onclick="changeLang('zh')" id="btn-zh" class="px-3.5 py-1.5 text-xs font-semibold rounded-xl border bg-blue-600 text-white cursor-pointer shadow-sm">繁體中文</button>
            <button onclick="changeLang('cn')" id="btn-cn" class="px-3.5 py-1.5 text-xs font-semibold rounded-xl border bg-white text-slate-600 hover:bg-slate-100 cursor-pointer shadow-sm">简体中文</button>
            <button onclick="changeLang('en')" id="btn-en" class="px-3.5 py-1.5 text-xs font-semibold rounded-xl border bg-white text-slate-600 hover:bg-slate-100 cursor-pointer shadow-sm">English</button>
        </div>

        <div class="text-center py-4">
            <h1 id="txt-title" class="text-3xl sm:text-4xl font-extrabold mb-3 tracking-tight">📅 自訂行程時間表</h1>
            <p id="txt-subtitle" class="text-sm sm:text-base text-slate-600 font-medium">網格支援【直接點擊】！輕鬆規劃你的完美每週行程！</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <div class="space-y-6 lg:col-span-4 w-full">
                <div id="panel-filter" class="bg-white p-6 rounded-2xl shadow-md border border-slate-200/80 transition-all">
                    <h3 id="txt-filter-title" class="text-base font-bold mb-4 flex items-center gap-2 text-slate-900">⏰ 顯示時間範圍 (24h)</h3>
                    <div class="grid grid-cols-2 gap-4 text-sm">
                        <div>
                            <label id="lbl-filter-start" class="block text-slate-500 font-medium mb-1.5">開始時間</label>
                            <select id="filterStartTime" onchange="updateTimeFilter()" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl bg-white text-slate-900 font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm sm:text-base"></select>
                        </div>
                        <div>
                            <label id="lbl-filter-end" class="block text-slate-500 font-medium mb-1.5">結束時間</label>
                            <select id="filterEndTime" onchange="updateTimeFilter()" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl bg-white text-slate-900 font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm sm:text-base"></select>
                        </div>
                    </div>
                </div>

                <div id="panel-list" class="bg-white p-6 rounded-2xl shadow-md border border-slate-200/80 h-fit transition-all">
                    <h2 id="txt-list-title" class="text-xl font-bold mb-2 text-slate-900">📝 我的每週行程一覽</h2>
                    <p id="txt-list-tip" class="text-xs text-slate-400 mb-4 font-medium">💡 提示：點擊時間表任意空格即可新增，點擊已有行程可進行修改。</p>
                    <ul id="courseList" class="space-y-3 max-h-[350px] overflow-y-auto pr-1 text-sm">
                        </ul>
                </div>
            </div>

            <div class="lg:col-span-8 w-full space-y-3">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                    <span id="txt-clash-alert" class="text-xs sm:text-sm text-slate-500 font-medium">⚠️ 同一時段重複加行程會觸發紅色撞時間警告。</span>
                    <button onclick="downloadTimetable()" id="btn-screenshot" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold px-5 py-3 rounded-xl shadow-md hover:shadow-lg transition cursor-pointer text-center border-none">
                        📸 下載時間表截圖
                    </button>
                </div>

                <div id="timetableCapture" class="bg-white p-5 rounded-2xl shadow-md border border-slate-200/80 overflow-x-auto w-full transition-all">
                    <div id="timetableHeader" class="timetable-grid border-b border-slate-200 pb-3 text-center font-bold text-xs sm:text-sm gap-1.5 text-slate-800">
                        <div id="th-time" class="font-extrabold text-slate-500">時間</div>
                        <div class="text-blue-600" id="th-mon">Mon</div>
                        <div class="text-blue-600" id="th-tue">Tue</div>
                        <div class="text-blue-600" id="th-wed">Wed</div>
                        <div class="text-blue-600" id="th-thu">Thu</div>
                        <div class="text-blue-600" id="th-fri">Fri</div>
                        <div class="text-amber-600" id="th-sat">Sat</div>
                        <div class="text-amber-600" id="th-sun">Sun</div>
                    </div>

                    <div id="timetableRows" class="divide-y divide-slate-100">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <div id="courseModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50 animate-fade-in">
        <div id="modalBox" class="bg-white rounded-2xl p-6 sm:p-8 max-w-md w-full shadow-2xl border border-slate-200 transform transition-all scale-100 text-slate-900">
            <h3 id="modal-title" class="text-xl font-extrabold mb-5">➕ 新增行程資料</h3>
            
            <div class="space-y-5">
                <div>
                    <label id="modal-label-name" class="block text-sm font-semibold text-slate-500 mb-1.5">項目 / 行程名稱</label>
                    <input type="text" id="modalCourseName" placeholder="" class="w-full px-3 py-3 border border-slate-300 rounded-xl bg-white text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-sm sm:text-base">
                </div>

                <div>
                    <label id="modal-label-day" class="block text-sm font-semibold text-slate-500 mb-1.5">星期幾</label>
                    <select id="modalCourseDay" class="w-full px-3 py-3 border border-slate-300 rounded-xl bg-white text-slate-900 font-medium text-sm sm:text-base">
                        <option value="1">星期一 (Mon)</option>
                        <option value="2">星期二 (Tue)</option>
                        <option value="3">星期三 (Wed)</option>
                        <option value="4">星期four (Thu)</option>
                        <option value="5">星期五 (Fri)</option>
                        <option value="6">星期六 (Sat)</option>
                        <option value="7">星期日 (Sun)</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label id="modal-label-start" class="block text-sm font-semibold text-slate-500 mb-1.5">開始時間</label>
                        <select id="modalStartTime" onchange="onModalStartChange()" class="w-full px-3 py-3 border border-slate-300 rounded-xl bg-white text-slate-900 font-medium text-sm sm:text-base"></select>
                    </div>
                    <div>
                        <label id="modal-label-end" class="block text-sm font-semibold text-slate-500 mb-1.5">結束時間</label>
                        <select id="modalEndTime" class="w-full px-3 py-3 border border-slate-300 rounded-xl bg-white text-slate-900 font-medium text-sm sm:text-base"></select>
                    </div>
                </div>

                <div class="flex gap-3 pt-3">
                    <button onclick="closeModal()" id="btn-modal-cancel" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl cursor-pointer text-center text-sm transition border-none">
                        取消
                    </button>
                    <button onclick="saveModalCourse()" id="btn-modal-confirm" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl cursor-pointer text-center text-sm transition shadow border-none">
                        確認加入
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const langPack = {
            zh: {
                title: "📅 自訂行程時間表",
                subtitle: "網格支援【直接點擊】！輕鬆規劃你的完美每週行程！",
                listTitle: "📝 我的每週行程一覽",
                listTip: "💡 提示：點擊時間表任意空格即可新增，點擊已有行程可進行修改。",
                clashAlert: "⚠️ 同一時段重複加行程會觸發紅色撞時間警告。",
                screenshot: "📸 下載時間表截圖",
                time: "時間",
                modalTitleAdd: "➕ 新增行程資料",
                modalTitleEdit: "✏️ 修改行程資料",
                labelName: "項目 / 行程名稱",
                labelDay: "星期幾",
                labelStart: "開始時間",
                labelEnd: "結束時間",
                btnCancel: "取消",
                btnConfirmAdd: "確認加入",
                btnConfirmEdit: "確認修改",
                placeholder: "例如: 補習 / 兼職 / 溫習",
                alertInput: "請輸入名稱！",
                alertTimeOrder: "結束時間必須遲過開始時間！",
                filterTitle: "⏰ 顯示時間範圍 (24h)",
                filterStart: "開始時間",
                filterEnd: "結束時間",
                darkBtnOn: "黑夜模式",
                darkBtnOff: "白天模式",
                days: ['', '星期一 (Mon)', '星期二 (Tue)', '星期三 (Wed)', '星期四 (Thu)', '星期五 (Fri)', '星期六 (Sat)', '星期日 (Sun)']
            },
            cn: {
                title: "📅 自定义行程时间表",
                subtitle: "网格支持【直接点击】！轻松规划你的完美每周行程！",
                listTitle: "📝 我的每周行程一览",
                listTip: "💡 提示：点击时间表任意空格即可新增，点击已有行程可进行修改。",
                clashAlert: "⚠️ 同一时段重复加行程会触发红色撞时间警告。",
                screenshot: "📸 下载时间表截图",
                time: "时间",
                modalTitleAdd: "➕ 新增行程资料",
                modalTitleEdit: "✏️ 修改行程资料",
                labelName: "项目 / 行程名称",
                labelDay: "星期几",
                labelStart: "开始时间",
                labelEnd: "结束时间",
                btnCancel: "取消",
                btnConfirmAdd: "确认加入",
                btnConfirmEdit: "确认修改",
                placeholder: "例如: 补习 / 兼职 / 温习",
                alertInput: "请输入名称！",
                alertTimeOrder: "结束时间必须迟过开始时间！",
                filterTitle: "⏰ 显示时间范围 (24h)",
                filterStart: "开始时间",
                filterEnd: "结束时间",
                darkBtnOn: "黑夜模式",
                darkBtnOff: "白天模式",
                days: ['', '星期一 (Mon)', '星期二 (Tue)', '星期三 (Wed)', '星期四 (Thu)', '星期五 (Fri)', '星期六 (Sat)', '星期日 (Sun)']
            },
            en: {
                title: "📅 Custom Weekly Schedule Planner",
                subtitle: "Click any grid cell directly to schedule! Plan your perfect week easily!",
                listTitle: "📝 My Weekly Overview",
                listTip: "💡 Tip: Click blank grid to add, click existing event to edit.",
                clashAlert: "⚠️ Adding multiple events to the same slot will trigger a red clash warning.",
                screenshot: "📸 Download Timetable Screenshot",
                time: "Time",
                modalTitleAdd: "➕ Add New Event",
                modalTitleEdit: "✏️ Edit Event Details",
                labelName: "Event Name",
                labelDay: "Day of the Week",
                labelStart: "Start Time",
                labelEnd: "End Time",
                btnCancel: "Cancel",
                btnConfirmAdd: "Confirm & Add",
                btnConfirmEdit: "Save Changes",
                placeholder: "e.g., Tutor / Part-time / Study",
                alertInput: "Please enter a name!",
                alertTimeOrder: "End time must be later than start time!",
                filterTitle: "⏰ Time Display Range (24h)",
                filterStart: "Start",
                filterEnd: "End",
                darkBtnOn: "Dark Mode",
                darkBtnOff: "Light Mode",
                days: ['', 'Monday (Mon)', 'Tuesday (Tue)', 'Wednesday (Wed)', 'Thursday (Thu)', 'Friday (Fri)', 'Saturday (Sat)', 'Sunday (Sun)']
            }
        };

        let currentLang = 'zh';
        let courses = [];
        let isDarkMode = false;
        let editingCourseId = null;
        
        let displayStart = 9;
        let displayEnd = 21;

        const startSelect = document.getElementById('modalStartTime');
        const endSelect = document.getElementById('modalEndTime');
        const filterStartSel = document.getElementById('filterStartTime');
        const filterEndSel = document.getElementById('filterEndTime');
        
        function formatTime(val) {
            let h = Math.floor(val);
            let m = (val % 1 === 0) ? '00' : '30';
            return `${h < 10 ? '0' + h : h}:${m}`;
        }

        // 偵測某個行程是否有跟其他行程撞時間
        function checkIsClashed(course) {
            return courses.some(c => 
                c.id !== course.id && 
                c.day === course.day && 
                ((course.start >= c.start && course.start < c.end) || 
                 (course.end > c.start && course.end <= c.end) || 
                 (course.start <= c.start && course.end >= c.end))
            );
        }

        function initTimeDropdowns() {
            startSelect.innerHTML = '';
            filterStartSel.innerHTML = '';
            filterEndSel.innerHTML = '';
            
            for(let i = 0; i <= 23.5; i += 0.5) {
                startSelect.options.add(new Option(formatTime(i), i));
                filterStartSel.options.add(new Option(formatTime(i), i));
            }
            for(let i = 0.5; i <= 24; i += 0.5) {
                filterEndSel.options.add(new Option(formatTime(i), i));
            }
            
            filterStartSel.value = displayStart;
            filterEndSel.value = displayEnd;
        }

        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            const body = document.getElementById('body');
            const darkBtnText = document.getElementById('txt-dark-btn');
            const btnDark = document.getElementById('btn-dark');
            const panelFilter = document.getElementById('panel-filter');
            const panelList = document.getElementById('panel-list');
            const timetableCapture = document.getElementById('timetableCapture');
            const modalBox = document.getElementById('modalBox');
            const txtSubtitle = document.getElementById('txt-subtitle');
            const txtTitle = document.getElementById('txt-title');
            const txtClashAlert = document.getElementById('txt-clash-alert');

            const filterTitle = document.getElementById('txt-filter-title');
            const listTitle = document.getElementById('txt-list-title');

            if (isDarkMode) {
                body.className = "bg-slate-950 text-white font-sans p-3 sm:p-6 md:p-8 transition-colors duration-200 min-h-screen";
                btnDark.className = "px-4 py-1.5 text-xs font-semibold rounded-xl border border-slate-700 bg-white text-black cursor-pointer flex items-center gap-1.5 shadow-sm hover:scale-105 transition";
                darkBtnText.innerText = langPack[currentLang].darkBtnOff;
                
                txtTitle.className = "text-3xl sm:text-4xl font-extrabold mb-3 tracking-tight text-white";
                txtSubtitle.className = "text-sm sm:text-base text-slate-300 font-medium";
                txtClashAlert.className = "text-xs sm:text-sm text-slate-400 font-medium";

                panelFilter.className = "bg-slate-900 p-6 rounded-2xl shadow-md border border-slate-800 text-white transition-all";
                panelList.className = "bg-slate-900 p-6 rounded-2xl shadow-md border border-slate-800 h-fit text-white transition-all";
                timetableCapture.className = "bg-slate-900 p-5 rounded-2xl shadow-md border border-slate-800 overflow-x-auto w-full transition-all";
                modalBox.className = "bg-slate-900 rounded-2xl p-6 sm:p-8 max-w-md w-full shadow-2xl border border-slate-800 transform transition-all scale-100 text-white";

                filterTitle.className = "text-base font-bold mb-4 flex items-center gap-2 text-white";
                listTitle.className = "text-xl font-bold mb-2 text-white";

                document.getElementById('timetableHeader').className = "timetable-grid border-b border-slate-800 pb-3 text-center font-bold text-xs sm:text-sm gap-1.5 text-white";
            } else {
                body.className = "bg-slate-50 text-slate-900 font-sans p-3 sm:p-6 md:p-8 transition-colors duration-200 min-h-screen";
                btnDark.className = "px-4 py-1.5 text-xs font-semibold rounded-xl border border-slate-300 bg-slate-900 text-white cursor-pointer flex items-center gap-1.5 shadow-sm hover:scale-105 transition";
                darkBtnText.innerText = langPack[currentLang].darkBtnOn;
                
                txtTitle.className = "text-3xl sm:text-4xl font-extrabold mb-3 tracking-tight text-slate-900";
                txtSubtitle.className = "text-sm sm:text-base text-slate-600 font-medium";
                txtClashAlert.className = "text-xs sm:text-sm text-slate-500 font-medium";

                panelFilter.className = "bg-white p-6 rounded-2xl shadow-md border border-slate-200/80 text-slate-900 transition-all";
                panelList.className = "bg-white p-6 rounded-2xl shadow-md border border-slate-200/80 h-fit text-slate-900 transition-all";
                timetableCapture.className = "bg-white p-5 rounded-2xl shadow-md border border-slate-200/80 overflow-x-auto w-full transition-all";
                modalBox.className = "bg-white rounded-2xl p-6 sm:p-8 max-w-md w-full shadow-2xl border border-slate-200 transform transition-all scale-100 text-slate-900";

                filterTitle.className = "text-base font-bold mb-4 flex items-center gap-2 text-slate-900";
                listTitle.className = "text-xl font-bold mb-2 text-slate-900";

                document.getElementById('timetableHeader').className = "timetable-grid border-b border-slate-200 pb-3 text-center font-bold text-xs sm:text-sm gap-1.5 text-slate-800";
            }
            
            updateDropdownStyles();
            renderTimetable();
            updateUI();
        }

        function updateDropdownStyles() {
            const allSelectsInputs = document.querySelectorAll('select, input[type="text"]');
            allSelectsInputs.forEach(el => {
                if (isDarkMode) {
                    el.className = "w-full px-3 py-2.5 border rounded-xl bg-slate-950 text-white border-slate-700 font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm sm:text-base";
                } else {
                    el.className = "w-full px-3 py-2.5 border rounded-xl bg-white text-slate-900 border-slate-300 font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm sm:text-base";
                }
            });
        }

        function updateTimeFilter() {
            let start = parseFloat(filterStartSel.value);
            let end = parseFloat(filterEndSel.value);
            
            if (start >= end) {
                alert(langPack[currentLang].alertTimeOrder);
                filterStartSel.value = displayStart;
                filterEndSel.value = displayEnd;
                return;
            }
            
            displayStart = start;
            displayEnd = end;
            renderTimetable();
        }

        function changeLang(lang) {
            currentLang = lang;
            const p = langPack[lang];
            
            document.getElementById('txt-title').innerText = p.title;
            document.getElementById('txt-subtitle').innerText = p.subtitle;
            document.getElementById('txt-list-title').innerText = p.listTitle;
            document.getElementById('txt-list-tip').innerText = p.listTip;
            document.getElementById('txt-clash-alert').innerText = p.clashAlert;
            document.getElementById('btn-screenshot').innerText = p.screenshot;
            document.getElementById('th-time').innerText = p.time;
            
            document.getElementById('txt-filter-title').innerText = p.filterTitle;
            document.getElementById('lbl-filter-start').innerText = p.filterStart;
            document.getElementById('lbl-filter-end').innerText = p.filterEnd;
            document.getElementById('txt-dark-btn').innerText = isDarkMode ? p.darkBtnOff : p.darkBtnOn;
            
            document.getElementById('modal-label-name').innerText = p.labelName;
            document.getElementById('modal-label-day').innerText = p.labelDay;
            document.getElementById('modal-label-start').innerText = p.labelStart;
            document.getElementById('modal-label-end').innerText = p.labelEnd;
            document.getElementById('btn-modal-cancel').innerText = p.btnCancel;
            document.getElementById('modalCourseName').placeholder = p.placeholder;

            if(editingCourseId) {
                document.getElementById('modal-title').innerText = p.modalTitleEdit;
                document.getElementById('btn-modal-confirm').innerText = p.btnConfirmEdit;
            } else {
                document.getElementById('modal-title').innerText = p.modalTitleAdd;
                document.getElementById('btn-modal-confirm').innerText = p.btnConfirmAdd;
            }

            ['zh', 'cn', 'en'].forEach(l => {
                const btn = document.getElementById(`btn-${l}`);
                if (l === lang) {
                    btn.className = "px-3.5 py-1.5 text-xs font-semibold rounded-xl border bg-blue-600 text-white cursor-pointer shadow-sm";
                } else {
                    btn.className = isDarkMode 
                        ? "px-3.5 py-1.5 text-xs font-semibold rounded-xl border border-slate-700 bg-slate-900 text-white cursor-pointer shadow-sm hover:bg-slate-800"
                        : "px-3.5 py-1.5 text-xs font-semibold rounded-xl border bg-white text-slate-600 hover:bg-slate-100 cursor-pointer shadow-sm";
                }
            });

            const daySelect = document.getElementById('modalCourseDay');
            for(let i=1; i<=7; i++) {
                daySelect.options[i-1].text = p.days[i];
            }

            updateUI();
        }

        function onModalStartChange() {
            const currentStart = parseFloat(startSelect.value);
            const savedEndValue = parseFloat(endSelect.value);
            
            endSelect.innerHTML = '';
            for(let i = currentStart + 0.5; i <= 24; i += 0.5) {
                endSelect.options.add(new Option(formatTime(i), i));
            }
            
            if (savedEndValue > currentStart) {
                endSelect.value = savedEndValue;
            } else {
                endSelect.value = currentStart + 1.0 <= 24 ? currentStart + 1.0 : currentStart + 0.5;
            }
        }

        function openModal(day, timeValue, courseId = null) {
            editingCourseId = courseId;
            const p = langPack[currentLang];

            if (editingCourseId) {
                document.getElementById('modal-title').innerText = p.modalTitleEdit;
                document.getElementById('btn-modal-confirm').innerText = p.btnConfirmEdit;
                
                const target = courses.find(c => c.id === courseId);
                if (target) {
                    document.getElementById('modalCourseName').value = target.name;
                    document.getElementById('modalCourseDay').value = target.day;
                    startSelect.value = target.start;
                    
                    endSelect.innerHTML = '';
                    for(let i = target.start + 0.5; i <= 24; i += 0.5) {
                        endSelect.options.add(new Option(formatTime(i), i));
                    }
                    endSelect.value = target.end;
                }
            } else {
                document.getElementById('modal-title').innerText = p.modalTitleAdd;
                document.getElementById('btn-modal-confirm').innerText = p.btnConfirmAdd;
                
                document.getElementById('modalCourseDay').value = day;
                startSelect.value = timeValue;
                onModalStartChange();
            }

            updateDropdownStyles();
            document.getElementById('courseModal').classList.remove('hidden');
            document.getElementById('modalCourseName').focus();
        }

        function closeModal() {
            document.getElementById('courseModal').classList.add('hidden');
            document.getElementById('modalCourseName').value = '';
            editingCourseId = null;
        }

        function saveModalCourse() {
            const name = document.getElementById('modalCourseName').value.trim();
            const day = parseInt(document.getElementById('modalCourseDay').value);
            const start = parseFloat(startSelect.value);
            const end = parseFloat(endSelect.value);

            if (!name) {
                alert(langPack[currentLang].alertInput);
                return;
            }
            if (start >= end) {
                alert(langPack[currentLang].alertTimeOrder);
                return;
            }

            if (editingCourseId) {
                const target = courses.find(c => c.id === editingCourseId);
                if (target) {
                    target.name = name;
                    target.day = day;
                    target.start = start;
                    target.end = end;
                }
            } else {
                courses.push({ id: Date.now(), name, day, start, end });
            }

            closeModal();
            updateUI();
        }

        function renderTimetable() {
            const rowsContainer = document.getElementById('timetableRows');
            rowsContainer.innerHTML = '';

            for (let time = displayStart; time < displayEnd; time += 0.5) {
                const row = document.createElement('div');
                
                // 動態設定：這一行裡面如果有比較多行程相撞，就改成 flex-col 或不設限高度，讓內容自然垂直向下排開撐大
                row.className = isDarkMode 
                    ? 'timetable-grid min-h-[55px] items-stretch text-center text-xs gap-1.5 border-b border-slate-800/60 py-1'
                    : 'timetable-grid min-h-[55px] items-stretch text-center text-xs gap-1.5 border-b border-slate-100 py-1';
                
                const timeLabel = document.createElement('div');
                timeLabel.className = isDarkMode
                    ? 'flex items-center justify-center border-r border-slate-800 text-white font-mono font-bold bg-slate-950'
                    : 'flex items-center justify-center border-r border-slate-100 text-slate-500 font-mono font-bold bg-slate-50/50';
                timeLabel.innerText = formatTime(time);
                row.appendChild(timeLabel);

                for (let day = 1; day <= 7; day++) {
                    const cell = document.createElement('div');
                    const slotCourses = courses.filter(c => c.day == day && time >= c.start && time < c.end).sort((a,b) => a.id - b.id);

                    if (slotCourses.length > 0) {
                        // 使用 flex-col，當行程多於 1 個時，格子會自動向下增高擴大，顯示出所有行程
                        cell.className = 'p-1 flex flex-col items-stretch justify-start gap-1 w-full h-full';
                        
                        if (slotCourses.length > 1) {
                            slotCourses.forEach(c => {
                                const subItem = document.createElement('div');
                                subItem.className = isDarkMode 
                                    ? 'bg-red-950 text-red-200 border border-red-800 rounded-xl flex items-center justify-center p-2 font-semibold text-center cursor-pointer shadow-sm hover:brightness-110 transition w-full break-all'
                                    : 'bg-red-50 text-red-700 border border-red-200 rounded-xl flex items-center justify-center p-2 font-semibold text-center cursor-pointer shadow-sm hover:bg-red-100 transition w-full break-all';
                                subItem.innerHTML = `<span>${c.name}</span>`;
                                subItem.setAttribute('onclick', `openModal(null, null, ${c.id})`);
                                cell.appendChild(subItem);
                            });
                        } else {
                            const c = slotCourses[0];
                            const subItem = document.createElement('div');
                            subItem.className = isDarkMode
                                ? 'flex-1 bg-blue-950 text-blue-200 border border-blue-900 rounded-xl flex items-center justify-center p-2 font-semibold text-center cursor-pointer shadow-sm hover:brightness-110 transition w-full break-all'
                                : 'flex-1 bg-blue-50/80 text-blue-700 border border-blue-100 rounded-xl flex items-center justify-center p-2 font-semibold text-center cursor-pointer shadow-sm hover:bg-blue-100 transition w-full break-all';
                            subItem.innerHTML = `<span>${c.name}</span>`;
                            subItem.setAttribute('onclick', `openModal(null, null, ${c.id})`);
                            cell.appendChild(subItem);
                        }
                    } else {
                        cell.className = isDarkMode
                            ? 'p-1 hover:bg-slate-900 text-transparent hover:text-slate-500 transition-all cursor-pointer flex items-center justify-center border border-dashed border-slate-800 rounded-xl min-h-[46px] font-bold text-base'
                            : 'p-1 hover:bg-slate-100 text-transparent hover:text-slate-400 transition-all cursor-pointer flex items-center justify-center border border-dashed border-slate-200 rounded-xl min-h-[46px] font-bold text-base';
                        cell.innerText = '＋';
                        cell.setAttribute('onclick', `openModal(${day}, ${time})`);
                    }
                    row.appendChild(cell);
                }
                rowsContainer.appendChild(row);
            }
        }

        function deleteCourse(id) {
            courses = courses.filter(c => c.id !== id);
            updateUI();
        }

        function updateUI() {
            renderTimetable();
            const list = document.getElementById('courseList');
            list.innerHTML = '';
            
            courses.forEach(c => {
                const li = document.createElement('li');
                const isClashed = checkIsClashed(c); // 檢查是否相撞

                // 如果相撞，強制把字體轉成鮮紅色
                let textColorClass = isDarkMode ? 'text-white' : 'text-slate-900';
                let subColorClass = 'text-slate-400';
                let borderClashClass = isDarkMode ? 'border-slate-800 hover:border-slate-700' : 'border-slate-100 hover:border-slate-200';

                if (isClashed) {
                    textColorClass = 'text-red-600 dark:text-red-400 font-bold';
                    subColorClass = 'text-red-500 dark:text-red-300 font-bold';
                    borderClashClass = 'border-red-300 bg-red-50/30';
                }

                li.className = isDarkMode
                    ? `flex justify-between items-center bg-slate-950 p-3 rounded-xl border shadow-sm transition ${borderClashClass}`
                    : `flex justify-between items-center bg-slate-50 p-3 rounded-xl border shadow-sm transition ${borderClashClass}`;
                
                li.innerHTML = `
                    <span class="truncate mr-2 cursor-pointer flex-1 font-medium" onclick="openModal(null, null, ${c.id})">
                        <strong class="text-sm sm:text-base ${textColorClass}">${c.name}</strong><br>
                        <span class="text-xs font-semibold ${subColorClass}">${langPack[currentLang].days[c.day]} ${formatTime(c.start)} - ${formatTime(c.end)}</span>
                    </span>
                    <button onclick="deleteCourse(${c.id}); event.stopPropagation();" class="text-red-400 hover:text-red-600 font-bold p-1.5 cursor-pointer border-none bg-transparent text-sm sm:text-base transition">❌</button>
                `;
                list.appendChild(li);
            });
        }

        function downloadTimetable() {
            const target = document.getElementById('timetableCapture');
            html2canvas(target).then(canvas => {
                const link = document.createElement('a');
                link.download = 'my-timetable.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        initTimeDropdowns();
        changeLang('zh');
    </script>
</body>
</html>
